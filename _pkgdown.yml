url: https://rbin.rsquaredacademy.com
development:
  mode: auto

template:
  package: rsatemplate
  bootstrap: 5
  params:
    site_url: https://rbin.rsquaredacademy.com
    hero_description: Tools for Binning Data
    course_topic: binning and feature engineering
    course_url: https://app.rsquaredacademy.com
    dev_repo: rsquaredacademy/rbin

authors:
  Aravind Hebbali:
    href: https://www.aravindhebbali.com

templates:
  params:
    bootswatch: cerulean

navbar:
  title: 'rbin'
  type: inverse
  left:
    - text: 'Home'
      href: index.html
    - text: 'Guides'
      menu:
        - text: 'Introduction'
          href: articles/introduction.html
    - text: 'Reference'
      menu:
        - text: 'Functions'
          href: reference/index.html
        - text: 'News'
          href: news/index.html
  right:
    - text: 'Rsquared Academy'
      href: https://www.rsquaredacademy.com
    - icon: fa-github
      href: https://github.com/rsquaredacademy/rbin

home:
  links:
    - text: Our R packages
      href: https://pkgs.rsquaredacademy.com
    - text: Read our blog
      href: https://blog.rsquaredacademy.com
    - text: Our ebooks
      href: https://ebooks.rsquaredacademy.com
    - text: Online courses
      href: https://www.rsquaredacademy.com

reference:
  - title: Continuous Data

    contents:
      - rbin_manual
      - rbin_quantiles
      - rbin_winsorize
      - rbin_equal_length
      - rbin_equal_freq
      - rbin_create
      - rbin

  - title: Categorical Data

    contents:
      - rbin_factor_combine
      - rbin_factor
      - rbin_factor_create

  - title: Addins

    contents:
      - rbinAddin
      - rbinFactorAddin

  - title: Data

    contents:
      - mbank

footer:
  structure:
    left: developed_by
    right: [built_with, privacy]
  components:
    privacy: '[Privacy](https://www.rsquaredacademy.com/privacy-policy.html) · <a href="#" data-rsa-analytics-optout>Turn off analytics</a>'
